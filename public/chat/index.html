<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Chat</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #chat-box { height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .user { font-weight: bold; color: blue; }
        .assistant { color: green; }
    </style>
</head>
<body>
    <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="openai-compat">Custom Gateway</option>
    </select>
    <input type="text" id="model" placeholder="Model name">
    <div id="chat-box"></div>
    <input type="text" id="input" placeholder="Type a message...">
    <button onclick="send()">Send</button>

    <script src="app.js"></script>
</body>
</html>
