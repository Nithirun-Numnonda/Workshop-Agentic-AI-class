<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Desk — Chat</title>
    <style>
        :root { color-scheme: dark; --bg: #0b1020; --panel: #121a2f; --line: #263352; --muted: #99a6c4; --text: #f5f7ff; --accent: #8b7cff; }
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 100% 0, #28205b 0, transparent 30%), var(--bg); }
        .shell { width: min(900px, calc(100% - 32px)); margin: auto; padding: 28px 0; } header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .brand { color: var(--text); font-weight: 750; text-decoration: none; } .back { color: var(--muted); font-size: 14px; text-decoration: none; } .back:hover { color: var(--text); }
        .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(18,26,47,.88); box-shadow: 0 24px 70px rgba(0,0,0,.2); }
        .toolbar { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); } label { display: flex; flex: 1; flex-direction: column; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        select, input, button { border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: #0e1528; font: inherit; } select, .toolbar input { width: 100%; padding: 10px 12px; outline: none; } select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,124,255,.16); }
        #chat-box { height: min(58vh, 520px); overflow-y: auto; padding: 24px; } .empty { display: grid; min-height: 260px; place-items: center; color: var(--muted); text-align: center; } .empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 20px; }
        .message { max-width: 78%; margin: 0 0 16px; padding: 13px 16px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; } .message.user { margin-left: auto; border-bottom-right-radius: 4px; background: #514895; } .message.assistant { border-bottom-left-radius: 4px; background: #202b47; } .message .role { display: block; margin-bottom: 4px; color: #b9b0ff; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
        .composer { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); } #input { min-width: 0; flex: 1; padding: 13px 14px; outline: none; } button { padding: 0 20px; border: 0; background: linear-gradient(135deg, #aaa0ff, #68ead9); color: #0d1224; font-weight: 800; cursor: pointer; } button:disabled { cursor: wait; opacity: .55; }
        .error { margin: 0 24px 16px; padding: 11px 13px; border: 1px solid #754454; border-radius: 10px; color: #ffb9c5; background: rgba(117,68,84,.18); } @media (max-width: 580px) { .shell { width: min(100% - 20px, 900px); padding-top: 18px; } .toolbar { flex-direction: column; } #chat-box { padding: 16px; } .message { max-width: 90%; } .composer { padding: 12px; } button { padding: 0 15px; } }
    </style>
</head>
<body>
    <div class="shell">
        <header><a class="brand" href="/">✦ AI Desk</a><a class="back" href="/">← Back to workspace</a></header>
        <section class="panel" aria-label="AI chat">
            <div class="toolbar">
                <label>Provider<select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom Gateway</option></select></label>
                <label>Model<input type="text" id="model" placeholder="Default model"></label>
            </div>
            <div id="chat-box"><div class="empty"><div><strong>What would you like to explore?</strong>Ask a question to begin a new conversation.</div></div></div>
            <div id="error" class="error" hidden role="alert"></div>
            <form class="composer" id="composer"><input type="text" id="input" aria-label="Message" placeholder="Message your AI assistant…" autocomplete="off"><button id="send" type="submit">Send&nbsp; ↗</button></form>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
