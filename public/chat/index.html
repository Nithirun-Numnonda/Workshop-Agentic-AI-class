<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Desk — Chat</title>
    <style>
        :root { color-scheme: dark; --bg: #071510; --panel: #0d2118; --line: #214c37; --muted: #9ab8a8; --text: #f2fff7; --accent: #58d68d; --accent-2: #b5f2c9; }
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 100% 0, #174f32 0, transparent 34%), var(--bg); }
        .shell { width: min(900px, calc(100% - 32px)); margin: auto; padding: 28px 0; } header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .brand { display: flex; align-items: center; gap: 9px; color: var(--text); font-weight: 750; text-decoration: none; } .brand::first-letter { color: var(--accent); } .back { color: var(--muted); font-size: 14px; text-decoration: none; transition: color .2s; } .back:hover { color: var(--accent-2); }
        .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(13,33,24,.9); box-shadow: 0 24px 70px rgba(0,0,0,.28); }
        .toolbar { display: flex; gap: 12px; padding: 17px; border-bottom: 1px solid var(--line); background: rgba(181,242,201,.035); } label { display: flex; flex: 1; flex-direction: column; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        select, input, button { border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: #091b13; font: inherit; } select, .toolbar input { width: 100%; padding: 10px 12px; outline: none; } select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,214,141,.16); }
        #chat-box { height: min(58vh, 520px); overflow-y: auto; padding: 26px; } .empty { display: grid; min-height: 260px; place-items: center; color: var(--muted); text-align: center; } .empty strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 20px; }
        .message { max-width: 78%; margin: 0 0 16px; padding: 13px 16px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; } .message.user { margin-left: auto; border-bottom-right-radius: 4px; background: linear-gradient(135deg, #237a4a, #185b38); } .message.assistant { border-bottom-left-radius: 4px; background: #143624; } .message .role { display: block; margin-bottom: 4px; color: var(--accent-2); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
        .composer { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); } #input { min-width: 0; flex: 1; padding: 13px 14px; outline: none; } button { padding: 0 20px; border: 0; background: linear-gradient(135deg, #83e9a8, #45cc7d); color: #062012; font-weight: 800; cursor: pointer; transition: filter .2s, transform .2s; } button:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); } button:disabled { cursor: wait; opacity: .55; }
        .error { margin: 0 24px 16px; padding: 11px 13px; border: 1px solid #875047; border-radius: 10px; color: #ffc3b5; background: rgba(135,80,71,.18); } @media (max-width: 580px) { .shell { width: min(100% - 20px, 900px); padding-top: 18px; } .toolbar { flex-direction: column; } #chat-box { padding: 16px; } .message { max-width: 90%; } .composer { padding: 12px; } button { padding: 0 15px; } }
    </style>
</head>
<body>
    <div class="shell">
        <header><a class="brand" href="/">✦ AI Desk</a><a class="back" href="/">← Back to workspace</a></header>
        <section class="panel" aria-label="AI chat">
            <div class="toolbar">
                <label>Provider<select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom Gateway</option></select></label>
                <label>Model<input type="text" id="model" placeholder="Default model"></label>
            </div>
            <div id="chat-box"><div class="empty"><div><strong>What would you like to explore?</strong>Ask a question to begin a new conversation.</div></div></div>
            <div id="error" class="error" hidden role="alert"></div>
            <form class="composer" id="composer"><input type="text" id="input" aria-label="Message" placeholder="Message your AI assistant…" autocomplete="off"><button id="send" type="submit">Send&nbsp; ↗</button></form>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
