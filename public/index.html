<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Desk — Workspace</title>
    <style>
        :root { color-scheme: dark; --bg: #0b1020; --panel: #121a2f; --line: #263352; --muted: #99a6c4; --text: #f5f7ff; --accent: #8b7cff; --accent-2: #52d8c7; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--text); background: radial-gradient(circle at 80% 0%, #28205b 0, transparent 35%), var(--bg); }
        .shell { width: min(1080px, calc(100% - 40px)); margin: auto; padding: 28px 0 56px; }
        nav { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
        .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; letter-spacing: .02em; }
        .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0d1224; font-weight: 900; }
        .status { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 14px var(--accent-2); }
        main { padding-top: 100px; max-width: 760px; }
        .eyebrow { color: var(--accent-2); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1 { max-width: 700px; margin: 16px 0; font-size: clamp(42px, 7vw, 76px); line-height: .98; letter-spacing: -.06em; }
        .intro { max-width: 560px; margin: 0; color: var(--muted); font-size: 18px; line-height: 1.65; }
        .card { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 42px; padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: rgba(18, 26, 47, .82); box-shadow: 0 20px 60px rgba(0,0,0,.2); }
        .card h2 { margin: 0 0 7px; font-size: 18px; }
        .card p { margin: 0; color: var(--muted); line-height: 1.5; }
        a.button { flex: 0 0 auto; padding: 13px 18px; border-radius: 11px; color: #0d1224; background: linear-gradient(135deg, #aaa0ff, #68ead9); font-weight: 800; text-decoration: none; transition: transform .2s, box-shadow .2s; }
        a.button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(104,234,217,.18); }
        @media (max-width: 600px) { .shell { width: min(100% - 28px, 1080px); } main { padding-top: 72px; } .card { align-items: flex-start; flex-direction: column; } a.button { width: 100%; text-align: center; } }
    </style>
</head>
<body>
    <div class="shell">
        <nav><div class="brand"><span class="brand-mark">✦</span> AI Desk</div><div class="status"><span class="dot"></span> Workspace online</div></nav>
        <main>
            <div class="eyebrow">Your AI workspace</div>
            <h1>Think clearly.<br>Build boldly.</h1>
            <p class="intro">A focused space for asking questions, exploring ideas, and working with the AI model that fits your task.</p>
            <div class="card">
                <div><h2>AI Chat</h2><p>Start a conversation with Gemini, OpenAI, or your custom gateway.</p></div>
                <a class="button" href="/chat/">Open chat <span aria-hidden="true">↗</span></a>
            </div>
        </main>
    </div>
</body>
</html>
