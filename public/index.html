<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Desk — Workspace</title>
    <style>
        :root { color-scheme: dark; --bg: #071510; --panel: #0d2118; --panel-soft: #112b20; --line: #214c37; --muted: #9ab8a8; --text: #f2fff7; --accent: #58d68d; --accent-strong: #25b66a; --accent-2: #b5f2c9; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--text); background: radial-gradient(circle at 85% -5%, #174f32 0, transparent 35%), radial-gradient(circle at 0% 100%, #0d2c1f 0, transparent 30%), var(--bg); }
        body::before { position: fixed; inset: 0; z-index: -1; opacity: .18; pointer-events: none; content: ""; background-image: linear-gradient(rgba(181,242,201,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(181,242,201,.08) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 80%); }
        .shell { width: min(1080px, calc(100% - 40px)); margin: auto; padding: 28px 0 56px; }
        nav { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
        .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 750; letter-spacing: .02em; }
        .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid rgba(181,242,201,.35); border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #062012; font-weight: 900; box-shadow: 0 8px 24px rgba(37,182,106,.22); }
        .status { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border: 1px solid rgba(88,214,141,.18); border-radius: 999px; background: rgba(13,33,24,.55); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
        main { padding-top: 112px; max-width: 780px; }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-2); font-size: 12px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
        .eyebrow::before { width: 24px; height: 1px; content: ""; background: var(--accent); }
        h1 { max-width: 700px; margin: 18px 0; font-size: clamp(44px, 7vw, 78px); line-height: .98; letter-spacing: -.065em; }
        h1 span { color: var(--accent); }
        .intro { max-width: 575px; margin: 0; color: var(--muted); font-size: 18px; line-height: 1.65; }
        .card { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 46px; padding: 25px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(135deg, rgba(17,43,32,.9), rgba(13,33,24,.72)); box-shadow: 0 24px 70px rgba(0,0,0,.24); }
        .card h2 { margin: 0 0 7px; font-size: 18px; }
        .card p { margin: 0; color: var(--muted); line-height: 1.5; }
        a.button { flex: 0 0 auto; padding: 13px 19px; border-radius: 11px; color: #062012; background: linear-gradient(135deg, #83e9a8, #45cc7d); font-weight: 800; text-decoration: none; transition: transform .2s, box-shadow .2s, filter .2s; }
        a.button:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 12px 28px rgba(69,204,125,.22); }
        a.button:focus-visible { outline: 3px solid rgba(181,242,201,.65); outline-offset: 3px; }
        @media (max-width: 600px) { .shell { width: min(100% - 28px, 1080px); } main { padding-top: 78px; } .status { padding: 7px 9px; font-size: 12px; } .card { align-items: flex-start; flex-direction: column; } a.button { width: 100%; text-align: center; } }
    </style>
</head>
<body>
    <div class="shell">
        <nav><div class="brand"><span class="brand-mark">✦</span> AI Desk</div><div class="status"><span class="dot"></span> Workspace online</div></nav>
        <main>
            <div class="eyebrow">Your AI workspace</div>
            <h1>Think clearly.<br><span>Build boldly.</span></h1>
            <p class="intro">A focused space for asking questions, exploring ideas, and working with the AI model that fits your task.</p>
            <div class="card">
                <div><h2>AI Chat</h2><p>Start a conversation with Gemini, OpenAI, or your custom gateway.</p></div>
                <a class="button" href="/chat/">Open chat <span aria-hidden="true">↗</span></a>
            </div>
        </main>
    </div>
</body>
</html>
